<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Đang ngoại tuyến | Tin Học Gen Z</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(160deg,#eff6ff,#fff 60%);color:#0f172a;font:16px/1.6 system-ui,-apple-system,sans-serif}.card{width:min(100%,440px);padding:28px;border:1px solid #dbeafe;border-radius:24px;background:#fff;box-shadow:0 18px 50px #0f172a14;text-align:center}.logo{width:64px;height:64px;object-fit:contain}h1{margin:14px 0 8px;font-size:26px;line-height:1.2}p{margin:0 0 22px;color:#64748b}button{min-height:48px;width:100%;border:0;border-radius:14px;background:#2563eb;color:#fff;font:700 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logo-icon.png" alt="Tin Học Gen Z" width="64" height="64" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Không thể tải nội dung mới. Hãy kiểm tra kết nối; những trang đã mở trước đó vẫn có thể xem.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
