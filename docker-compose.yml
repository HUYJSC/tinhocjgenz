version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinhocgenz-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://tinhocgenz.io.vn
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/tinhocgenz?schema=public
      - CRON_SECRET=tinhocgenz_cron_secret_key_2026
      - DEFAULT_AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - app_data:/app/data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: tinhocgenz-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tinhocgenz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  app_data:
